name: Workflow_test_Docker_v2
on:
  push:
    branches:
      - devel

jobs:
  test_workflow:
    runs-on: ubuntu-latest
    container:
      image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker/cmssw_10_6_30-slc7_amd64_gcc700:latest
      options: --user 1001:1001
    steps:
      - uses: actions/checkout@v4

      - name: Verify container
        run: (ls /.dockerenv && echo "Inside container") || echo "Not in container"

      - name: Build & run
        shell: bash
        run: |
          ls -l
          scram b
          cd test_Customisers/test/
          cmsRun test_v1_2016ULpostVFP_MC_config.py

