name: Workflow_test_Docker_v2
on:
  push:
    branches:
      - devel

jobs:
  test_workflow:
    runs-on: ubuntu-latest
    name: Test workflow using docker

    container:
        image: gitlab-registry.cern.ch/cms-cloud/cmssw-docker/cmssw_10_6_30-slc7_amd64_gcc700:latest
        options: -u 1001:1001

    steps:
    - name: Initialisation of the test workflow
      uses: AdityaGarg8/remove-unwanted-software@v1
      with:
        remove-android: 'true'
        remove-dotnet: 'true'
        remove-haskell: 'true'

    - name: Checkout the GitHub repository to the workspace
      uses: actions/checkout@v4

    - name: Running the docker container
      shell: bash
      run: |
        ls -l
        scram b
        cd test_Customisers/test/
        cmsRun test_v1_2016ULpostVFP_MC_config.py