name: Workflow_test_Docker_v2
on:
  push:
    branches:
      - devel

jobs:
  test_workflow:
    runs-on: ubuntu-latest
    name: Test workflow using docker

    steps:
    - name: Setting up the Repository
      uses: AdityaGarg8/remove-unwanted-software@v1
      with:
        remove-android: 'true'
        remove-haskell: 'true'
        remove-dotnet: 'true'

    - name: Checkout the GitHub repository to the workspace
      uses: actions/checkout@v4

    - name: Running the docker container
      run: |
        docker run -u 1001:1001 -v ${{ github.workspace }}:/workspace -w /workspace gitlab-registry.cern.ch/cms-cloud/cmssw-docker/cmssw_10_6_30-slc7_amd64_gcc700:latest bash -c "
          ls -l
          scram b
          cd test_Customisers/test/
        "