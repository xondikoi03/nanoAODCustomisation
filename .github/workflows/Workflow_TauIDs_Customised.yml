name: Workflow_test_Docker_v2
on:
  push:
    branches:
      - devel

jobs:
  test_workflow:
    runs-on: ubuntu-latest
    name: Test workflow using docker

    steps:
    - name: Setting up the Repository
      uses: AdityaGarg8/remove-unwanted-software@v1
      with:
        remove-android: 'true'
        remove-haskell: 'true'
        remove-dotnet: 'true'

    - name: Checkout the GitHub repository to the workspace
      uses: actions/checkout@v4

    - name: Running the docker container
      run: |
        docker run cmsopendata/cmssw_10_6_30-slc7_amd64_gcc700:latest \
        bash -c " \
        ls -l && pwd && \
        git clone https://github.com/xondikoi03/nanoAODCustomisation.git && \
        cd nanoAODCustomisation && \
        git checkout devel && \
        cd test_Customisers && \
        scram b && \
        cd test && \
        cmsRun test_v1_2016ULpostVFP_MC_config_1.py"